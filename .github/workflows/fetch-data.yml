# Refresh the dashboard data every hour.
#
# The TaskMarket API does not accept browser requests from other websites, so
# data is fetched server-side by this scheduled job and committed back as
# data.json. The page itself only ever reads that static file.
name: Refresh market data

on:
  schedule:
    # Hourly, a few minutes past the hour to avoid :00 contention.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch fresh data
        run: node fetch-data.mjs

      - name: Commit data.json if it changed
        run: |
          git config user.name "taskmarket-pulse-bot"
          git config user.email "taskmarket-pulse-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes to data.json"
          else
            git commit -m "chore: refresh market data"
            git push
          fi
